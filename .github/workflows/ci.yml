# Continuous integration: formatting, lint, compile and test gates.
#
# The checks are split into separate jobs so a failure names itself instead of
# greying out one long log. Windows is the primary target: the
# client binds shell32 / ole32 / crypt32 / advapi32 directly (the file picker,
# DPAPI session storage and the system-theme registry read), so linting and
# testing only make sense there. The cross-platform `check` matrix still
# type-checks macOS and Linux, because build.yml ships binaries for both.
#
# The live test suite stays inert unless PIXIV_LIVE_PHPSESSID is set, so this
# workflow never touches pixiv.net and needs no secret.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # YAML that parses is not YAML that runs; actionlint knows the workflow
      # schema, the event payloads and the shellcheck rules for run blocks. The
      # image bundles shellcheck, so a run: block gets checked for real - pinning
      # the tag keeps the gate identical to what was verified, instead of moving
      # under it whenever a new check lands upstream.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Three build scripts in the dependency graph probe pkg-config and fail
      # outright when the headers are missing: wayland-sys asks for
      # wayland-client, yeslogic-fontconfig-sys (through fontique) for
      # fontconfig, tiny-xlib for x11 and x11-xcb. They are not probed at all on
      # Windows or macOS, which is why Linux is the leg that goes red first.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      # cargo check compiles every crate and runs the build scripts, so this
      # also type-checks the .slint UI: build.rs feeds ui/**.slint through
      # slint-build, and a syntax error there fails the crate, not just the
      # linker step.
      - name: Compile check
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: Clippy
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: cargo test
        run: cargo test --workspace --locked

  # G25: until round nine nothing ran the gate scripts here. tools/gates.ps1 and
  # tools/selftest-gates.ps1 - the negative experiment every gate change is accepted on -
  # ran on one developer's machine and nowhere else, so a gate could regress and CI would
  # still show a column of green ticks. This job is that hole, closed.
  gates:
    name: Gate scripts
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates

      # Build first: a compile error then names itself in its own step instead of
      # scrolling past inside a gate summary line.
      - name: Build
        run: cargo build --workspace --all-targets --locked

      # No -Ui: that section of tools/gates.ps1 launches the app, reads the UI Automation
      # tree, presses real Tab keys and captures the screen, which needs an interactive
      # desktop a runner does not have - the same reason that section is opt-in locally.
      # -SkipTest and -SkipBuild are the two steps the test job and build.yml already own;
      # what this job adds is the path gate, the lint gate and, above all,
      # tools/selftest-gates.ps1 with its negative experiments.
      - name: Gate scripts
        run: pwsh -File tools/gates.ps1 -SkipTest -SkipBuild

  ci:
    name: CI
    # One status to require in branch protection, and it only reports success
    # when every gate above did.
    if: always()
    needs: [format, workflows, check, clippy, test, gates]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1