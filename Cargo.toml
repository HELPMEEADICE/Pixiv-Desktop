[package]
name = "pixiv-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "5"
futures = "0.3"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }
open = "5"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "gzip", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.18"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
urlencoding = "2"
zip = { version = "2", features = ["deflate"] }

[build-dependencies]
slint-build = "1.18"
