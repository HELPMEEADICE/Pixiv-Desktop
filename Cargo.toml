[workspace]
members = [
    "crates/pixiv-types",
    "crates/pixiv-api",
    "crates/pixiv-image",
    "crates/pixiv-store",
    "crates/pixiv-download",
    "crates/pixiv-ugoira",
    "crates/pixiv-demo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
pixiv-types = { path = "crates/pixiv-types" }
pixiv-api = { path = "crates/pixiv-api" }
pixiv-image = { path = "crates/pixiv-image" }
pixiv-store = { path = "crates/pixiv-store" }
pixiv-download = { path = "crates/pixiv-download" }
pixiv-ugoira = { path = "crates/pixiv-ugoira" }
pixiv-demo = { path = "crates/pixiv-demo" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "stream",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
parking_lot = "0.12"
sha2 = "0.10"
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "5"
open = "5"

[package]
name = "pixiv-desktop"
description = "Native Pixiv desktop client built with Rust and Slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixiv-types.workspace = true
pixiv-api.workspace = true
pixiv-image.workspace = true
pixiv-store.workspace = true
pixiv-download.workspace = true
pixiv-ugoira.workspace = true
pixiv-demo.workspace = true

slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
open.workspace = true
directories.workspace = true
urlencoding.workspace = true
image.workspace = true

[build-dependencies]
slint-build = "1.18"

# The development profile is what `cargo run` and the capture harness use. At the
# default opt-level 0 the Slint software renderer is slow enough to look like a
# bug, and the debug binary carried 601MB of debuginfo. Dependencies are optimised
# (they are compiled once and rarely change); this crate keeps level 1 so a
# backtrace still points at a line.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
